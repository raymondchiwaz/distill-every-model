[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-distill-every-model"
version = "0.3.2"
description = "Local-first, consent-based capture of LLM outputs into an open training-data commons"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=41",
  "huggingface_hub>=0.34",
  "zstandard>=0.22",
]

[project.scripts]
dem = "dem.cli:main"
demd = "dem.daemon:main"

[tool.setuptools]
packages = ["dem", "dem.adapters", "dem.pipeline"]

[tool.setuptools.package-data]
dem = ["review.css", "review-selection.js", "source-logos/*.png", "source-logos/*.txt"]
